# Override local opcional.
# Docker Compose carga automáticamente este archivo junto a docker-compose.yml.
# No redefine command ni entrypoint del backend: así se conserva
# `php artisan serve --host=0.0.0.0 --port=8000` del archivo principal.

services:
  backend:
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

  frontend:
    environment:
      VITE_API_BASE_URL: http://localhost:4005/api
