services:
  db:
    image: mysql:8.0
    container_name: lafrenona3_staging_db
    restart: unless-stopped
    ports:
      - "53306:3306"
    environment:
      MYSQL_DATABASE: ${STAGING_DB_DATABASE:-lafrenona3_staging}
      MYSQL_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD:?Define STAGING_DB_ROOT_PASSWORD en el entorno o en .env.staging}
      MYSQL_USER: ${STAGING_DB_USER:?Define STAGING_DB_USER en el entorno o en .env.staging}
      MYSQL_PASSWORD: ${STAGING_DB_PASSWORD:?Define STAGING_DB_PASSWORD en el entorno o en .env.staging}
    volumes:
      - lafrenona3_staging_db_data:/var/lib/mysql
    networks:
      - lafrenona3_staging_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: lafrenona3_staging_redis
    restart: unless-stopped
    ports:
      - "56379:6379"
    networks:
      - lafrenona3_staging_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: ./docker/backend.Dockerfile
    container_name: lafrenona3_staging_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      APP_URL: ${STAGING_APP_URL:-http://localhost:5080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${STAGING_DB_DATABASE:-lafrenona3_staging}
      DB_USERNAME: ${STAGING_DB_USER:?Define STAGING_DB_USER}
      DB_PASSWORD: ${STAGING_DB_PASSWORD:?Define STAGING_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    command:
      - php-fpm
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lafrenona3_staging_network

  frontend-build:
    image: node:22-alpine
    container_name: lafrenona3_staging_frontend_build
    working_dir: /app
    volumes:
      - ./frontend:/app
      - lafrenona3_staging_frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: ${STAGING_API_BASE_URL:-/api}
    command:
      - sh
      - -lc
      - npm ci && npm run build
    networks:
      - lafrenona3_staging_network

  nginx:
    image: nginx:alpine
    container_name: lafrenona3_staging_nginx
    restart: unless-stopped
    ports:
      - "5080:80"
    volumes:
      - ./docker/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    networks:
      - lafrenona3_staging_network

networks:
  lafrenona3_staging_network:
    driver: bridge

volumes:
  lafrenona3_staging_db_data:
    driver: local
  lafrenona3_staging_frontend_node_modules:
    driver: local
